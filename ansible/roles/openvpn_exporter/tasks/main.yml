---
- name: Install go
  apt:
    name: golang-go
    state: present

- name: Ensure OpenVPN log directory exists
  ansible.builtin.file:
    path: /var/log/openvpn
    state: directory
    mode: '0750'
    owner: root
    group: root

- name: Download OpenVPN Exporter archive
  ansible.builtin.get_url:
    url: "{{ openvpn_exporter_download_url }}"
    dest: "/tmp/openvpn_exporter-{{ openvpn_exporter_version }}.tar.gz"
    mode: '0644'

- name: Unarchive OpenVPN Exporter binary to temporary directory
  ansible.builtin.unarchive:
    src: "/tmp/openvpn_exporter-{{ openvpn_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/openvpn_exporter-{{ openvpn_exporter_version }}"

- name: Compile OpenVPN Exporter binary from source code
  ansible.builtin.command:
    cmd: "go build -o /usr/local/bin/openvpn_exporter main.go"
    chdir: "/tmp/openvpn_exporter-{{ openvpn_exporter_version }}"
    creates: /usr/local/bin/openvpn_exporter
  notify: Restart openvpn_exporter

- name: Create EnvironmentFile for OpenVPN Exporter options
  ansible.builtin.template:
    src: openvpn_exporter.default.j2
    dest: /etc/default/openvpn_exporter
    mode: '0644'
    owner: root
    group: root
  notify: Restart openvpn_exporter

- name: Create systemd service unit from template
  ansible.builtin.template:
    src: openvpn_exporter.service.j2
    dest: /etc/systemd/system/openvpn_exporter.service
    mode: '0644'
    owner: root
    group: root
  notify: Restart openvpn_exporter

- name: Ensure OpenVPN Exporter service is enabled and started
  ansible.builtin.systemd:
    name: openvpn_exporter
    state: started
    enabled: true
    daemon_reload: true
