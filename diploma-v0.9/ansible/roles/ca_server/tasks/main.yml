- name: Install easy-rsa
  apt:
    name: easy-rsa
    state: present

- name: Create CA directory using make-cadir
  command: make-cadir "{{ easyrsa_dir }}"
  args:
    creates: "{{ easyrsa_dir }}"

- name: Deploy vars file
  template:
    src: vars.j2
    dest: "{{ easyrsa_dir }}/vars"
    mode: '0600'

- name: Initialize PKI
  command: ./easyrsa init-pki
  args:
    chdir: "{{ easyrsa_dir }}"
    creates: "{{ easyrsa_dir }}/pki"

- name: Build CA certificate
  command: ./easyrsa --batch --req-cn="{{ ca_name }}" build-ca nopass
  args:
    chdir: "{{ easyrsa_dir }}"
    creates: "{{ easyrsa_dir }}/pki/ca.crt"

- name: Find all files inside the private directory
  find:
    paths: "{{ easyrsa_dir }}/pki/private"
    file_type: file
    recurse: yes
  register: private_files

- name: Set permissions on all secret files inside private directory
  file:
    path: "{{ item.path }}"
    state: file
    mode: '0600'
  loop: "{{ private_files.files }}"

- name: Check for authorized_keys
  stat:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
  register: authorized_keys_check

- name: Fail if no SSH key is present before disabling password auth
  fail:
    msg: "authorized_keys is missing or empty for user {{ ansible_user }}. Refusing to disable password authentication to avoid lockout."
  when: not (authorized_keys_check.stat.exists and authorized_keys_check.stat.size > 0)

- name: Disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: restart sshd
  when:
    - authorized_keys_check.stat.exists
    - authorized_keys_check.stat.size > 0

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: incoming

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present

- name: Deploy fail2ban jail.local
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  notify: restart fail2ban

- name: Ensure fail2ban is enabled and running
  service:
    name: fail2ban
    state: started
    enabled: yes