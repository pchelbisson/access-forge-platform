global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets:
          - "localhost:9100"
          - "10.10.0.6:9100"
          - "10.10.0.27:9100"
        labels:
          env: "production"

  - job_name: "openvpn"
    static_configs:
      - targets:
          - "10.10.0.27:9176"
